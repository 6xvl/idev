[package]
name = "idev"
version = "0.2.0"
edition = "2021"
description = "A small iPhone toolbox for Windows: device info, battery health and history, storage hogs, crash insights, live log, network capture, security check, home screen tools."
license = "MIT"
repository = "https://github.com/6xvl/idev"

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "diagnostics_relay", "springboardservices", "afc", "crashreportcopymobile", "installation_proxy", "syslog_relay", "pcapd", "misagent", "amfi"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
plist = "1"
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[profile.release]
# Smaller binary, and no debug info that would carry build-machine paths.
strip = true
debug = false
lto = "thin"
